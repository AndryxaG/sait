<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки на карте Москвы и Подмосковья</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- JSZip for Folder Archiving and Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #e5e7eb;
        }

        /* Custom marker styling */
        .custom-marker-icon {
            background: transparent;
            border: none;
            touch-action: none;
        }

        .marker-pin-inner {
            transform-origin: bottom center;
            will-change: transform;
        }

        /* Leaflet popup customization */
        .leaflet-popup-content-wrapper {
            border-radius: 1rem;
            padding: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .leaflet-popup-content {
            margin: 0.5rem;
            line-height: 1.4;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.03);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.25);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased overflow-hidden">

    <!-- Password Screen Lock Overlay -->
    <div id="auth-overlay" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[9999] flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-7 text-center border border-gray-100 transform transition-transform">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                🔐
            </div>
            <h2 class="text-xl font-bold text-gray-900 mb-1" id="auth-title">Доступ защищен</h2>
            <p class="text-xs text-gray-500 mb-6" id="auth-desc">Введите пароль для просмотра ваших заметок</p>

            <form id="auth-form" onsubmit="event.preventDefault(); verifyPassword();" class="space-y-4">
                <div>
                    <input type="password" id="auth-password-input" placeholder="Введите пароль..." class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-center text-gray-900 font-semibold tracking-widest text-sm transition-all">
                    <p id="auth-error-msg" class="text-xs text-red-500 font-medium mt-2 hidden"></p>
                </div>

                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold text-xs rounded-2xl shadow-lg shadow-blue-500/25 transition-all">
                    Войти в систему
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-gray-100 flex items-center justify-between text-[11px] text-gray-400 font-medium">
                <button onclick="changeStoredPassword()" class="hover:text-blue-600 transition-colors">⚙️ Сменить пароль</button>
                <span>Заметки на карте</span>
            </div>
        </div>
    </div>

    <!-- Main Content Header Bar -->
    <header class="absolute top-4 left-4 right-4 md:right-auto z-[1000] flex flex-wrap items-center gap-2 pointer-events-none">
        <div class="bg-white/90 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-lg border border-gray-200/80 flex items-center gap-3 pointer-events-auto">
            <div class="flex items-center gap-2">
                <span class="text-xl">📍</span>
                <h1 class="font-bold text-sm md:text-base text-gray-800 tracking-tight">Заметки на карте</h1>
            </div>
            <span id="notes-counter" class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-600 rounded-lg border border-blue-100">
                Заметок: 0
            </span>
        </div>

        <!-- Search Input Bar & Dropdown -->
        <div class="relative bg-white/90 backdrop-blur-md px-3 py-2 rounded-2xl shadow-lg border border-gray-200/80 flex items-center gap-2 pointer-events-auto min-w-[240px] sm:min-w-[300px]">
            <span class="text-gray-400 text-xs">🔍</span>
            <input type="text" id="map-search-input" placeholder="Поиск заметок и мест..." oninput="handleSearchInput(this.value)" onfocus="handleSearchFocus()" class="w-full bg-transparent text-xs text-gray-800 outline-none font-medium placeholder-gray-400">
            <button id="clear-search-btn" onclick="clearSearch()" class="hidden text-gray-400 hover:text-gray-600 text-xs font-bold px-1 transition-colors">✕</button>

            <!-- Search Results Dropdown Panel -->
            <div id="search-results-dropdown" class="absolute top-full left-0 right-0 mt-2 bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-gray-200/80 hidden max-h-72 overflow-y-auto p-2 z-50 flex-col gap-1.5 transition-all">
            </div>
        </div>

        <!-- Map Layer / Provider Switcher -->
        <div class="bg-white/90 backdrop-blur-md px-3 py-2 rounded-2xl shadow-lg border border-gray-200/80 flex items-center gap-2 pointer-events-auto">
            <select id="map-provider-select" onchange="changeMapProvider(this.value)" class="bg-gray-50 border border-gray-200 text-gray-700 text-xs font-semibold rounded-xl px-2.5 py-1.5 outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer">
                <option value="osm">🗺️ OpenStreetMap</option>
                <option value="carto_light">🗺️ Свободная карта (Светлая)</option>
                <option value="google_roadmap">🗺️ Google Карты</option>
                <option value="google_satellite">🛰️ Google Спутник</option>
                <option value="google_hybrid">🌍 Google Гибрид</option>
            </select>
        </div>

        <div class="bg-white/90 backdrop-blur-md px-3 py-2 rounded-2xl shadow-lg border border-gray-200/80 flex items-center gap-2 pointer-events-auto">
            <button onclick="selectLocalFolder()" id="folder-btn" title="Синхронизировать с папкой ПК" class="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 hover:text-amber-800 text-xs font-semibold rounded-xl transition-all border border-amber-200/80 flex items-center gap-1.5">
                <span id="folder-status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                📁 <span id="folder-btn-text" class="hidden sm:inline">Выбрать папку ПК</span>
            </button>
            <button onclick="exportNotesZip()" title="Скачать все заметки архивом ZIP" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-sm transition-all flex items-center gap-1.5">
                📦 <span class="hidden sm:inline">Скачать ZIP</span>
            </button>
            <button onclick="document.getElementById('zip-import-input').click()" title="Загрузить заметки из ZIP архива" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow-sm transition-all flex items-center gap-1.5">
                📥 <span class="hidden sm:inline">Импорт ZIP</span>
            </button>
            <button onclick="lockScreen()" title="Заблокировать доступ" class="p-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs rounded-xl transition-all flex items-center justify-center">
                🔒
            </button>
            <input type="file" id="zip-import-input" accept=".zip" class="hidden" onchange="importNotesZip(this.files[0]); this.value='';">
        </div>

            </header>

    <!-- Map Viewport Container -->
    <main class="relative w-full h-screen">
        <div id="map"></div>

        <!-- Folder Status Banner Notice -->
        <div id="folder-warning-banner" class="absolute bottom-6 left-4 z-[1000] bg-amber-50/95 backdrop-blur-md border border-amber-200/90 text-amber-900 px-3.5 py-2.5 rounded-2xl shadow-xl max-w-xs sm:max-w-sm flex items-center justify-between gap-3 transition-all duration-300">
            <div class="flex items-center gap-2.5 text-xs font-medium">
                <span class="text-base shrink-0">⚠️</span>
                <div>
                    <p class="font-bold text-amber-900 text-xs">Папка ПК не выбрана</p>
                    <p class="text-[11px] text-amber-700 leading-tight">Заметки хранятся в браузере. Выберите папку или импортируйте ZIP для переноса.</p>
                </div>
            </div>
            <div class="flex items-center gap-1 shrink-0">
                <button onclick="selectLocalFolder()" class="px-2.5 py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold rounded-xl shadow-sm transition-colors whitespace-nowrap">
                    Выбрать
                </button>
                <button onclick="dismissFolderWarning()" class="text-amber-500 hover:text-amber-700 p-1 rounded-lg text-xs font-bold transition-colors" title="Скрыть">
                    ✕
                </button>
            </div>
        </div>

        <!-- Dynamic Color & Tag Filter Panel -->
        <div id="filter-panel" class="absolute top-4 right-4 z-[1000] bg-white/95 backdrop-blur-md p-3.5 rounded-2xl shadow-xl border border-gray-200/80 hidden flex-col gap-3 max-w-[260px] max-h-[80vh] overflow-y-auto">
            <div>
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider px-1 block mb-1.5">Фильтр по цвету</span>
                <div id="filter-colors" class="flex flex-wrap gap-1.5 items-center"></div>
            </div>
            <div id="filter-tags-section" class="border-t border-gray-100 pt-2 hidden">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider px-1 block mb-1.5">Фильтр по тэгам</span>
                <div id="filter-tags" class="flex flex-wrap gap-1.5 items-center"></div>
            </div>
        </div>
    </main>

    <!-- Note Creation / Editing Modal -->
    <div id="note-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[2000] flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="note-modal-content">
            <div class="flex justify-between items-center mb-5">
                <h2 id="modal-title-text" class="text-lg font-bold text-gray-800">Новая заметка</h2>
                <button type="button" onclick="closeModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none p-1 rounded-lg hover:bg-gray-100 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="note-form" onsubmit="event.preventDefault(); saveNote();" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Заголовок</label>
                    <input type="text" id="note-title" placeholder="Например: Любимое кафе или Патриаршие" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-gray-800 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Описание и ссылки</label>
                    <textarea id="note-text" rows="3" placeholder="Введите информацию или вставьте URL-ссылку..." class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none text-gray-800 text-sm"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Цвет метки</label>
                    <div id="color-picker-container" class="flex flex-wrap gap-2 items-center"></div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Тэги</label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="note-tag-input" placeholder="Например: кафе, парк..." class="flex-1 px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-xs text-gray-800" onkeydown="if(event.key==='Enter'){event.preventDefault(); handleAddTagInput();}">
                        <button type="button" onclick="handleAddTagInput()" class="px-3 py-2 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-xl text-xs font-semibold border border-blue-200 transition-colors shrink-0">
                            + Добавить
                        </button>
                    </div>
                    <div id="note-tags-container" class="flex flex-wrap gap-1.5 mb-2"></div>
                    <div id="quick-tags-container" class="flex flex-wrap gap-1 items-center text-xs"></div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Изображение</label>
                        <span class="text-[10px] text-gray-400 font-normal">Ctrl+V для вставки из буфера</span>
                    </div>
                    
                    <div class="space-y-2">
                        <input type="url" id="note-image-url" placeholder="Вставьте ссылку на изображение (https://...)" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-xs text-gray-800" oninput="handleImageUrlInput()">
                        
                        <div class="flex items-center gap-2">
                            <label class="flex-1 cursor-pointer text-center py-2 px-3 border border-dashed border-gray-300 hover:border-blue-500 rounded-xl bg-gray-50 hover:bg-blue-50/50 text-xs font-medium text-gray-600 transition-colors">
                                📁 Выбрать файл
                                <input type="file" id="note-image-file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                            </label>
                        </div>

                        <div id="image-preview-container" class="relative hidden mt-2 rounded-xl overflow-hidden border border-gray-200 bg-gray-100/80">
                            <img id="image-preview" src="" alt="Предпросмотр" class="w-full max-h-48 object-contain">
                            <button type="button" onclick="removeImage()" class="absolute top-2 right-2 bg-black/60 hover:bg-black/80 text-white rounded-full p-1 text-xs transition-colors shadow">
                                ✕
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-2.5 pt-3 border-t border-gray-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-xl transition-colors">
                        Отмена
                    </button>
                    <button type="submit" id="modal-submit-btn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-md transition-colors">
                        Добавить на карту
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[3000] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const MOSCOW_CENTER = [55.7558, 37.6173];
        const PRESET_COLORS = [
            { name: 'Синий', value: '#3B82F6' },
            { name: 'Красный', value: '#EF4444' },
            { name: 'Зелёный', value: '#10B981' },
            { name: 'Жёлтый', value: '#F59E0B' },
            { name: 'Фиолетовый', value: '#8B5CF6' },
            { name: 'Розовый', value: '#EC4899' },
            { name: 'Оранжевый', value: '#F97316' },
            { name: 'Серый', value: '#6B7280' }
        ];

        const TILE_PROVIDERS = {
            osm: {
                url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                options: { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }
            },
            carto_light: {
                url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
                options: { maxZoom: 19, attribution: '&copy; CARTO' }
            },
            google_roadmap: {
                url: 'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
                options: { maxZoom: 20, attribution: '&copy; Google Maps' }
            },
            google_satellite: {
                url: 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
                options: { maxZoom: 20, attribution: '&copy; Google Maps' }
            },
            google_hybrid: {
                url: 'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',
                options: { maxZoom: 20, attribution: '&copy; Google Maps' }
            }
        };

        let map;
        let currentTileLayer = null;
        let allMarkers = [];
        let editingNoteId = null;
        let currentClickLatLng = null;
        let currentFilterColor = null;
        let currentFilterTag = null;
        let modalTags = [];
        let selectedColor = PRESET_COLORS[0].value;
        let selectedImage = null;
        let dirHandle = null;
        let isFolderWarningDismissed = false;
        let searchDebounceTimer = null;

        // Password protection variables
        let appPasswordHash = localStorage.getItem('map_notes_password_hash');

        window.onload = function () {
            checkPasswordProtection();
        };

        function checkPasswordProtection() {
            const overlay = document.getElementById('auth-overlay');
            const title = document.getElementById('auth-title');
            const desc = document.getElementById('auth-desc');
            const pwdInput = document.getElementById('auth-password-input');

            if (!appPasswordHash) {
                // First time setup
                title.textContent = 'Установите пароль';
                desc.textContent = 'Придумайте пароль для защиты ваших заметок';
                overlay.classList.remove('hidden');
                pwdInput.focus();
            } else if (sessionStorage.getItem('map_notes_authenticated') === 'true') {
                overlay.classList.add('hidden');
                initMap();
            } else {
                title.textContent = 'Доступ защищен';
                desc.textContent = 'Введите пароль для входа в карту';
                overlay.classList.remove('hidden');
                pwdInput.focus();
            }
        }

        async function hashString(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verifyPassword() {
            const pwdInput = document.getElementById('auth-password-input');
            const errField = document.getElementById('auth-error-msg');
            const value = pwdInput.value.trim();

            if (!value) {
                errField.textContent = 'Пароль не может быть пустым';
                errField.classList.remove('hidden');
                return;
            }

            const hashed = await hashString(value);

            if (!appPasswordHash) {
                // Save new password
                localStorage.setItem('map_notes_password_hash', hashed);
                appPasswordHash = hashed;
                sessionStorage.setItem('map_notes_authenticated', 'true');
                document.getElementById('auth-overlay').classList.add('hidden');
                showToast('Пароль успешно установлен!');
                initMap();
            } else if (hashed === appPasswordHash) {
                sessionStorage.setItem('map_notes_authenticated', 'true');
                document.getElementById('auth-overlay').classList.add('hidden');
                errField.classList.add('hidden');
                pwdInput.value = '';
                initMap();
            } else {
                errField.textContent = 'Неверный пароль. Попробуйте еще раз.';
                errField.classList.remove('hidden');
                pwdInput.value = '';
                pwdInput.focus();
            }
        }

        function lockScreen() {
            sessionStorage.removeItem('map_notes_authenticated');
            checkPasswordProtection();
            showToast('Экран заблокирован');
        }

        function changeStoredPassword() {
            if (confirm('Вы действительно хотите сбросить пароль? Сброс потребуется подтвердить старым паролем.')) {
                localStorage.removeItem('map_notes_password_hash');
                sessionStorage.removeItem('map_notes_authenticated');
                appPasswordHash = null;
                checkPasswordProtection();
            }
        }

        function initMap() {
            if (!map) {
                map = L.map('map', {
                    doubleClickZoom: false,
                    zoomControl: false // 1. Отключаем стандартное расположение (topleft)
                }).setView(MOSCOW_CENTER, 10);

                // 2. Устанавливаем кнопки масштаба в правый нижний угол
                L.control.zoom({ position: 'bottomright' }).addTo(map);

                const savedProvider = localStorage.getItem('map_provider') || 'osm';
                const selectEl = document.getElementById('map-provider-select');
                if (selectEl) selectEl.value = savedProvider;
                changeMapProvider(savedProvider);

                map.on('dblclick', function (e) {
                    currentClickLatLng = e.latlng;
                    openModal();
                });

                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') {
                        closeModal();
                        if (map) map.closePopup();
                    }
                });


                document.addEventListener('paste', function (e) {
                    const modal = document.getElementById('note-modal');
                    if (modal.classList.contains('hidden')) return;

                    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                    for (let index = 0; index < items.length; index++) {
                        const item = items[index];
                        if (item.type.indexOf('image') !== -1) {
                            const blob = item.getAsFile();
                            const reader = new FileReader();
                            reader.onload = function (event) {
                                selectedImage = event.target.result;
                                showImagePreview(selectedImage);
                                showToast('Изображение вставлено из буфера');
                            };
                            reader.readAsDataURL(blob);
                            break;
                        }
                    }
                });

                renderPresetColorPicker();
                loadFromLocalStorage();
                updateFolderWarningVisibility();
            }

            setTimeout(() => {
                if (map) map.invalidateSize();
            }, 200);
        }

        function changeMapProvider(providerKey) {
            if (!map) return;
            if (currentTileLayer) {
                map.removeLayer(currentTileLayer);
            }
            const provider = TILE_PROVIDERS[providerKey] || TILE_PROVIDERS.osm;
            currentTileLayer = L.tileLayer(provider.url, provider.options).addTo(map);
            localStorage.setItem('map_provider', providerKey);
        }

        function handleSearchFocus() {
            const input = document.getElementById('map-search-input');
            if (input && input.value.trim()) {
                handleSearchInput(input.value);
            }
        }

        function clearSearch() {
            const input = document.getElementById('map-search-input');
            const clearBtn = document.getElementById('clear-search-btn');
            const dropdown = document.getElementById('search-results-dropdown');
            if (input) input.value = '';
            if (clearBtn) clearBtn.classList.add('hidden');

                dropdown.classList.add('hidden');

        function handleSearchInput(query) {
            const clearBtn = document.getElementById('clear-search-btn');
            const dropdown = document.getElementById('search-results-dropdown');
            const q = query.trim().toLowerCase();

            if (!q) {
                clearSearch();
                return;
            }

            if (clearBtn) clearBtn.classList.remove('hidden');

            if (searchDebounceTimer) clearTimeout(searchDebounceTimer);

            const matchedNotes = allMarkers.filter(m => {
                const titleMatch = (m.title || '').toLowerCase().includes(q);
                const textMatch = (m.text || '').toLowerCase().includes(q);
                const tagMatch = Array.isArray(m.tags) && m.tags.some(t => t.toLowerCase().includes(q));
                return titleMatch || textMatch || tagMatch;
            });

            renderSearchResults(matchedNotes, [], true);

            searchDebounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&accept-language=ru&limit=5`);
                    if (res.ok) {
                        const locations = await res.json();
                        renderSearchResults(matchedNotes, locations, false);
                    }
                } catch (e) {
                    console.warn("Geocoding search failed:", e);
                }
            }, 350);
        }

        function createSvgIcon(color, isUnlocked = false) {
            const pulseClass = isUnlocked ? 'scale-125 -translate-y-2 drop-shadow-xl' : '';
            return `
                <div class="marker-pin-inner transition-all duration-300 ease-out transform ${pulseClass} flex items-center justify-center">
                    <svg width="32" height="48" viewBox="0 0 32 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 0C7.163 0 0 7.163 0 16C0 28 16 48 16 48C16 48 32 28 32 16C32 7.163 24.837 0 16 0Z" fill="${color}"/>
                        <circle cx="16" cy="16" r="6" fill="white"/>
                    </svg>
                </div>
            `;

        function setupLongPressDrag(marker, noteData) {
            let pressTimer = null;
            let isDraggingActive = false;
            let startPos = null;

            function startPress(e) {
                const oe = e.originalEvent || e;
                if (oe.button && oe.button !== 0) return;

                const clientX = oe.clientX || (oe.touches && oe.touches[0] ? oe.touches[0].clientX : 0);
                const clientY = oe.clientY || (oe.touches && oe.touches[0] ? oe.touches[0].clientY : 0);
                
                startPos = { x: clientX, y: clientY };
                isDraggingActive = false;

                pressTimer = setTimeout(() => {
                    isDraggingActive = true;
                    
                    const unlockedIcon = L.divIcon({
                        className: 'custom-marker-icon',
                        html: createSvgIcon(noteData.color, true),
                        iconSize: [32, 48],
                        iconAnchor: [16, 48],
                        popupAnchor: [0, -42]
                    });
                    marker.setIcon(unlockedIcon);

                    if (map.dragging) map.dragging.disable();
                    map.closePopup();
                    showToast('Маркер разблокирован! Перетащите его в нужное место');

                    window.addEventListener('mousemove', onWindowMove);
                    window.addEventListener('touchmove', onWindowMove, { passive: false });
                    window.addEventListener('mouseup', onWindowUp);
                    window.addEventListener('touchend', onWindowUp);
                    window.addEventListener('touchcancel', onWindowUp);
                }, 500);
            }

            function cancelPress() {
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
            }

            function movePress(e) {
                if (!pressTimer || isDraggingActive) return;
                const oe = e.originalEvent || e;
                const currentX = oe.clientX || (oe.touches && oe.touches[0] ? oe.touches[0].clientX : 0);
                const currentY = oe.clientY || (oe.touches && oe.touches[0] ? oe.touches[0].clientY : 0);
                if (startPos && Math.hypot(currentX - startPos.x, currentY - startPos.y) > 10) {
                    cancelPress();
                }
            }

            function onWindowMove(e) {
                if (!isDraggingActive) return;
                if (e.preventDefault && e.cancelable) e.preventDefault();
                
                const latlng = map.mouseEventToLatLng(e);
                if (latlng) {
                    marker.setLatLng(latlng);
                }
            }

            async function onWindowUp(e) {
                cancelPress();
                if (!isDraggingActive) return;
                
                isDraggingActive = false;
                
                window.removeEventListener('mousemove', onWindowMove);
                window.removeEventListener('touchmove', onWindowMove);
                window.removeEventListener('mouseup', onWindowUp);
                window.removeEventListener('touchend', onWindowUp);
                window.removeEventListener('touchcancel', onWindowUp);

                if (map.dragging) map.dragging.enable();

                const defaultIcon = L.divIcon({
                    className: 'custom-marker-icon',
                    html: createSvgIcon(noteData.color, false),
                    iconSize: [32, 48],
                    iconAnchor: [16, 48],
                    popupAnchor: [0, -42]
                });
                marker.setIcon(defaultIcon);

                const newLatLng = marker.getLatLng();
                noteData.lat = newLatLng.lat;
                noteData.lng = newLatLng.lng;

                marker.setPopupContent(createPopupContent(noteData));
                saveToLocalStorage();
                await saveNoteToLocalFolder(noteData);
                showToast('Заметка перемещена');
            }

            marker.on('mousedown touchstart', startPress);
            marker.on('mousemove touchmove', movePress);
            marker.on('mouseup touchend touchcancel', cancelPress);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function linkifyAndEscape(text) {
            if (!text) return '';
            const urlPattern = /(\b(https?):\/\/[[-a-zA-Z0-9+&@#\/%?=~_|!:,.;]*[-a-zA-Z0-9+&@#\/%=~_|])/ig;
            const parts = text.split(urlPattern);
            let result = '';

            for (let i = 0; i < text.length;) {
                const match = urlPattern.exec(text);
                if (!match) {
                    result += escapeHtml(text.slice(i));
                    break;
                }
                result += escapeHtml(text.slice(i, match.index));
                const url = match[0];
                result += `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline font-semibold hover:text-blue-800 break-all">${escapeHtml(url)}</a>`;
                i = match.index + url.length;
            }
            return result.replace(/\n/g, '<br>');
        }

        function sanitizeFolderName(name) {
            return (name || 'note').replace(/[\/\\?%*:|"<>]/g, '_').trim();
        }

        function createPopupContent(note) {

                    ${note.tags && note.tags.length > 0 ? `

                            ${note.tags.map(t => `<span class="px-2 py-0.5 bg-blue-50 text-blue-700 text-[10px] font-semibold rounded-md border border-blue-100">#${escapeHtml(t)}</span>`).join('')}
                        </div>
                    ` : ''}
                    ${note.text 
                        ? `<div class="text-xs text-gray-600 leading-relaxed max-h-36 overflow-y-auto break-words mb-3">${linkifyAndEscape(note.text)}</div>` 
                        : `<p class="text-xs text-gray-400 italic mb-3">Нет описания</p>`

                    <div class="pt-2 border-t border-gray-100 flex justify-between items-center">

        }

        function handleAddTagInput() {

        function addModalTag(tagName) {
            const clean = tagName.trim().replace(/^#/, '');
            if (clean && !modalTags.includes(clean)) {
                modalTags.push(clean);
                renderModalTags();
            }
        }

        function removeModalTag(tagName) {
            modalTags = modalTags.filter(t => t !== tagName);
            renderModalTags();
        }

        function renderModalTags() {
            const container = document.getElementById('note-tags-container');
            if (container) {
                container.innerHTML = modalTags.map(t => `
                    <span class="inline-flex items-center gap-1 px-2.5 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded-lg text-xs font-medium">
                        #${escapeHtml(t)}
                        <button type="button" onclick="removeModalTag('${escapeHtml(t)}')" class="text-blue-400 hover:text-blue-600 focus:outline-none font-bold text-xs ml-0.5">&times;</button>
                    </span>
                `).join('');
            }

            const quickContainer = document.getElementById('quick-tags-container');
            if (quickContainer) {
                const allExistingTags = getAllExistingTags();
                const unusedTags = allExistingTags.filter(t => !modalTags.includes(t));
                if (unusedTags.length > 0) {
                    quickContainer.innerHTML = `
                        <span class="text-[10px] text-gray-400 mr-1 font-medium">Существующие:</span>
                        ${unusedTags.map(t => `
                            <button type="button" onclick="addModalTag('${escapeHtml(t)}')" class="px-2 py-0.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-md text-[11px] transition-colors">
                                +${escapeHtml(t)}
                            </button>

                } else {
                    quickContainer.innerHTML = '';
                }
            }
        }

        function getAllExistingTags() {
            const set = new Set();
            allMarkers.forEach(m => {
                if (Array.isArray(m.tags)) {
                    m.tags.forEach(t => set.add(t));
                }
            });
            return Array.from(set);
        }

        function openModal(noteToEdit = null) {
            const modal = document.getElementById('note-modal');
            const modalContent = document.getElementById('note-modal-content');
            const modalTitleText = document.getElementById('modal-title-text');
            const modalSubmitBtn = document.getElementById('modal-submit-btn');
            const titleInput = document.getElementById('note-title');
            const textInput = document.getElementById('note-text');
            const urlInput = document.getElementById('note-image-url');

            if (noteToEdit) {
                editingNoteId = noteToEdit.id;
                modalTitleText.textContent = 'Редактировать заметку';
                modalSubmitBtn.textContent = 'Сохранить';
                titleInput.value = noteToEdit.title || '';
                textInput.value = noteToEdit.text || '';
                selectedColor = noteToEdit.color || PRESET_COLORS[0].value;
                selectedImage = noteToEdit.image || null;
                modalTags = Array.isArray(noteToEdit.tags) ? [...noteToEdit.tags] : [];
                if (selectedImage) {
                    if (selectedImage.startsWith('http')) {
                        if (urlInput) urlInput.value = selectedImage;
                    }
                    showImagePreview(selectedImage);
                } else {
                    removeImage();
                }
            } else {
                editingNoteId = null;
                modalTitleText.textContent = 'Новая заметка';
                modalSubmitBtn.textContent = 'Добавить на карту';
                titleInput.value = '';
                textInput.value = '';
                selectedColor = PRESET_COLORS[0].value;
                modalTags = [];
                removeImage();
            }

            renderPresetColorPicker();
            renderModalTags();

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                titleInput.focus();
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('note-modal');
            const modalContent = document.getElementById('note-modal-content');
            if (!modal) return;
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                editingNoteId = null;
                currentClickLatLng = null;
            }, 300);
        }

        function handleEditNote(id) {
            const note = allMarkers.find(m => m.id === id);
            if (note) {
                map.closePopup();
                openModal(note);
            }
        }

        async function handleDeleteNote(id) {
            const index = allMarkers.findIndex(m => m.id === id);
            if (index !== -1) {
                const note = allMarkers[index];
                map.removeLayer(note.marker);
                await deleteNoteFromLocalFolder(note.title);
                allMarkers.splice(index, 1);
                updateCounter();
                updateFilterUI();
                saveToLocalStorage();
                showToast('Заметка удалена');
            }
        }

        async function saveNote() {
            const titleInput = document.getElementById('note-title');
            const textInput = document.getElementById('note-text');

            const title = titleInput.value.trim() || 'Без заголовка';

            const isDuplicate = allMarkers.some(m => {
                if (editingNoteId !== null && m.id === editingNoteId) {
                    return false;
                }
                return m.title.trim().toLowerCase() === title.toLowerCase();
            });

            if (isDuplicate) {
                showToast('Заметка с таким именем уже существует!');
                titleInput.focus();
                titleInput.classList.add('ring-2', 'ring-red-500');
                setTimeout(() => titleInput.classList.remove('ring-2', 'ring-red-500'), 2000);
                return;
            }

            const text = textInput.value.trim();
            const color = selectedColor;
            const image = selectedImage;
            const tags = [...modalTags];

            const customIcon = L.divIcon({
                className: 'custom-marker-icon',
                html: createSvgIcon(color),
                iconSize: [32, 48],
                iconAnchor: [16, 48],
                popupAnchor: [0, -42]
            });

            let oldTitle = null;

            if (editingNoteId !== null) {
                const noteData = allMarkers.find(m => m.id === editingNoteId);
                if (noteData) {
                    if (noteData.title !== title) {
                        oldTitle = noteData.title;
                    }
                    noteData.title = title;
                    noteData.text = text;
                    noteData.color = color;
                    noteData.image = image;
                    noteData.tags = tags;
                    noteData.marker.setIcon(customIcon);
                    noteData.marker.setPopupContent(createPopupContent(noteData));
                    showToast('Заметка обновлена');
                }
            } else {
                if (!currentClickLatLng) return;

                const newId = Date.now();
                const marker = L.marker(currentClickLatLng, { 
                    icon: customIcon,
                    draggable: false 
                }).addTo(map);

                const noteData = {
                    id: newId,
                    marker: marker,
                    color: color,
                    title: title,
                    text: text,
                    image: image,
                    tags: tags,
                    lat: currentClickLatLng.lat,
                    lng: currentClickLatLng.lng
                };

                setupLongPressDrag(marker, noteData);

                marker.bindPopup(createPopupContent(noteData));
                allMarkers.push(noteData);
                marker.openPopup();
                showToast('Заметка создана');
            }

            if (oldTitle) {
                await deleteNoteFromLocalFolder(oldTitle);
            }

            const targetNote = editingNoteId !== null 
                ? allMarkers.find(m => m.id === editingNoteId) 
                : allMarkers[allMarkers.length - 1];
            
            await saveNoteToLocalFolder(targetNote);

            closeModal();
            updateCounter();
            updateFilterUI();
            saveToLocalStorage();
        }

        function updateFolderWarningVisibility() {
            const warningBanner = document.getElementById('folder-warning-banner');
            const folderBtnText = document.getElementById('folder-btn-text');
            const folderBtn = document.getElementById('folder-btn');
            const statusDot = document.getElementById('folder-status-dot');

            if (dirHandle) {
                if (warningBanner) warningBanner.classList.add('hidden');
                if (folderBtnText) folderBtnText.textContent = `Папка: ${dirHandle.name}`;
                if (folderBtn) {
                    folderBtn.className = 'px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold rounded-xl transition-all border border-emerald-200/80 flex items-center gap-1.5';
                }
                if (statusDot) {
                    statusDot.className = 'w-2 h-2 rounded-full bg-emerald-500';
                }
            } else {
                if (folderBtnText) folderBtnText.textContent = 'Выбрать папку ПК';
                if (folderBtn) {
                    folderBtn.className = 'px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 hover:text-amber-800 text-xs font-semibold rounded-xl transition-all border border-amber-200/80 flex items-center gap-1.5';
                }
                if (statusDot) {
                    statusDot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';
                }

                if (warningBanner) {
                    if (isFolderWarningDismissed) {

        function dismissFolderWarning() {

            updateFolderWarningVisibility();
        }

        async function selectLocalFolder() {
            try {
                if (!('showDirectoryPicker' in window)) {
                    showToast('Ваш браузер не поддерживает прямое сохранение в папки. Используйте "Скачать ZIP" или "Импорт ZIP"');
                    return;
                }
                dirHandle = await window.showDirectoryPicker();
                updateFolderWarningVisibility();
                showToast(`Папка «${dirHandle.name}» подключена`);
                
                await readNotesFromLocalFolder();

                for (const note of allMarkers) {
                    await saveNoteToLocalFolder(note);
                }
            } catch (err) {
                if (err.name === 'SecurityError') {
                    showToast('Ограничение безопасности: скачайте заметки кнопкой "Скачать ZIP"');
                } else if (err.name !== 'AbortError') {
                    console.error(err);
                    showToast('Ошибка доступа к папке');
                }
            }
        }

        async function readNotesFromLocalFolder() {
            if (!dirHandle) return;
            try {
                let loadedCount = 0;
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'directory') {
                        try {
                            const subDir = entry;
                            const fileHandle = await subDir.getFileHandle('note_info.json');
                            const file = await fileHandle.getFile();
                            const text = await file.text();
                            const data = JSON.parse(text);

                            if (data && data.coordinates && typeof data.coordinates.lat === 'number') {
                                if (allMarkers.some(m => m.id === data.id || m.title === data.title)) {
                                    continue;
                                }

                                let image = null;
                                try {
                                    const imgHandle = await subDir.getFileHandle('image.png');
                                    const imgFile = await imgHandle.getFile();
                                    image = await new Promise((res) => {
                                        const reader = new FileReader();
                                        reader.onload = e => res(e.target.result);
                                        reader.readAsDataURL(imgFile);
                                    });
                                } catch (e) {
                                    try {
                                        const imgHandle = await subDir.getFileHandle('image.jpg');
                                        const imgFile = await imgHandle.getFile();
                                        image = await new Promise((res) => {
                                            const reader = new FileReader();
                                            reader.onload = e => res(e.target.result);
                                            reader.readAsDataURL(imgFile);
                                        });
                                    } catch (e2) {
                                        try {
                                            const urlHandle = await subDir.getFileHandle('image_url.txt');
                                            const urlFile = await urlHandle.getFile();
                                            image = (await urlFile.text()).trim();
                                        } catch (e3) {}
                                    }
                                }

                                const latlng = [data.coordinates.lat, data.coordinates.lng];
                                const customIcon = L.divIcon({
                                    className: 'custom-marker-icon',
                                    html: createSvgIcon(data.color || '#3B82F6'),
                                    iconSize: [32, 48],
                                    iconAnchor: [16, 48],
                                    popupAnchor: [0, -42]
                                });

                                const marker = L.marker(latlng, { icon: customIcon, draggable: false }).addTo(map);

                                const noteData = {
                                    id: data.id || Date.now() + Math.random(),
                                    marker: marker,
                                    color: data.color || '#3B82F6',
                                    title: data.title,
                                    text: data.text || '',
                                    image: image,
                                    tags: data.tags || [],
                                    lat: data.coordinates.lat,
                                    lng: data.coordinates.lng
                                };

                                setupLongPressDrag(marker, noteData);
                                marker.bindPopup(createPopupContent(noteData));
                                allMarkers.push(noteData);
                                loadedCount++;
                            }
                        } catch (subErr) {}
                    }
                }
                if (loadedCount > 0) {
                    updateCounter();
                    updateFilterUI();
                    saveToLocalStorage();
                    showToast(`Загружено заметок из папки: ${loadedCount}`);
                }
            } catch (err) {
                console.warn("Ошибка чтения папки:", err);
            }
        }

        async function saveNoteToLocalFolder(note) {
            if (!dirHandle || !note) return;
            try {
                const folderName = sanitizeFolderName(note.title);
                const subDirHandle = await dirHandle.getDirectoryHandle(folderName, { create: true });
                
                const fileHandle = await subDirHandle.getFileHandle('note_info.json', { create: true });
                const writable = await fileHandle.createWritable();
                
                const noteExportData = {
                    id: note.id,
                    title: note.title,
                    text: note.text,
                    color: note.color,
                    tags: note.tags || [],
                    coordinates: { lat: note.lat, lng: note.lng },
                    updatedAt: new Date().toISOString()
                };
                
                await writable.write(JSON.stringify(noteExportData, null, 2));
                await writable.close();

                if (note.image) {
                    if (note.image.startsWith('data:image')) {
                        const parts = note.image.split(';base64,');
                        const contentType = parts[0].split(':')[1] || 'image/png';
                        const ext = contentType.includes('jpeg') || contentType.includes('jpg') ? 'jpg' : 'png';
                        const imgHandle = await subDirHandle.getFileHandle(`image.${ext}`, { create: true });
                        const imgWritable = await imgHandle.createWritable();
                        const byteCharacters = atob(parts[1]);
                        const byteNumbers = new Array(byteCharacters.length);
                        for (let i = 0; i < byteCharacters.length; i++) {
                            byteNumbers[i] = byteCharacters.charCodeAt(i);
                        }
                        const byteArray = new Uint8Array(byteNumbers);
                        await imgWritable.write(new Blob([byteArray], { type: contentType }));
                        await imgWritable.close();
                    } else {
                        const urlHandle = await subDirHandle.getFileHandle('image_url.txt', { create: true });
                        const urlWritable = await urlHandle.createWritable();
                        await urlWritable.write(note.image);
                        await urlWritable.close();
                    }
                }
            } catch (e) {
                console.error("Ошибка сохранения в папку:", e);
            }
        }

        async function deleteNoteFromLocalFolder(title) {
            if (!dirHandle || !title) return;
            try {
                const folderName = sanitizeFolderName(title);
                await dirHandle.removeEntry(folderName, { recursive: true });
            } catch (e) {
                console.warn("Папка не найдена или уже удалена:", e);
            }
        }

        async function exportNotesZip() {
            if (allMarkers.length === 0) {
                showToast('Нет заметок для экспорта');
                return;
            }

            if (typeof JSZip === 'undefined') {
                showToast('Модуль архивации загружается...');
                return;
            }

            try {
                showToast('Формирование ZIP-архива...');
                const zip = new JSZip();

                for (const note of allMarkers) {
                    const folderName = sanitizeFolderName(note.title);
                    const folder = zip.folder(folderName);

                    const noteExportData = {
                        id: note.id,
                        title: note.title,
                        text: note.text,
                        color: note.color,
                        tags: note.tags || [],
                        coordinates: { lat: note.lat, lng: note.lng },
                        updatedAt: new Date().toISOString()
                    };

                    folder.file('note_info.json', JSON.stringify(noteExportData, null, 2));

                    if (note.image) {
                        if (note.image.startsWith('data:image')) {
                            const parts = note.image.split(';base64,');
                            const contentType = parts[0].split(':')[1] || 'image/png';
                            const ext = contentType.includes('jpeg') || contentType.includes('jpg') ? 'jpg' : 'png';
                            folder.file(`image.${ext}`, parts[1], { base64: true });
                        } else {
                            folder.file('image_url.txt', note.image);
                        }
                    }
                }

                const content = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `Map_Notes_${new Date().toISOString().slice(0, 10)}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
                showToast('ZIP-архив успешно скачан!');
            } catch (err) {
                console.error('Ошибка экспорта ZIP:', err);
                showToast('Ошибка при формировании архива');
            }
        }

        async function importNotesZip(file) {
            if (!file) return;

            if (typeof JSZip === 'undefined') {
                showToast('Модуль архивации загружается...');
                return;
            }

            try {
                showToast('Распаковка и импорт заметок...');
                const zip = new JSZip();
                const contents = await zip.loadAsync(file);
                let importedCount = 0;

                const folderMap = {};

                for (const filename of Object.keys(contents.files)) {
                    const zipObj = contents.files[filename];
                    if (zipObj.dir) continue;

                    const parts = filename.split('/');
                    if (parts.length < 2) continue;

                    const folderName = parts[0];
                    const baseName = parts[parts.length - 1];

                    if (!folderMap[folderName]) folderMap[folderName] = {};

                    if (baseName === 'note_info.json') {
                        const jsonStr = await zipObj.async('text');
                        folderMap[folderName].json = JSON.parse(jsonStr);
                    } else if (baseName.startsWith('image.') && !baseName.endsWith('.txt')) {
                        const base64 = await zipObj.async('base64');
                        const ext = baseName.split('.').pop().toLowerCase();
                        const mime = ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg' : 'image/png';
                        folderMap[folderName].image = `data:${mime};base64,${base64}`;
                    } else if (baseName === 'image_url.txt') {
                        const url = await zipObj.async('text');
                        folderMap[folderName].image = url.trim();
                    }
                }

                for (const folderName in folderMap) {
                    const item = folderMap[folderName];
                    if (!item.json) continue;

                    const data = item.json;

                    if (allMarkers.some(m => m.id === data.id || m.title.toLowerCase() === data.title.toLowerCase())) {
                        continue;
                    }

                    const latlng = [data.coordinates.lat, data.coordinates.lng];
                    const customIcon = L.divIcon({
                        className: 'custom-marker-icon',
                        html: createSvgIcon(data.color || '#3B82F6'),
                        iconSize: [32, 48],
                        iconAnchor: [16, 48],
                        popupAnchor: [0, -42]
                    });

                    const marker = L.marker(latlng, { icon: customIcon, draggable: false }).addTo(map);

                    const noteData = {
                        id: data.id || Date.now() + Math.random(),
                        marker: marker,
                        color: data.color || '#3B82F6',
                        title: data.title,
                        text: data.text || '',
                        image: item.image || null,
                        tags: data.tags || [],
                        lat: data.coordinates.lat,
                        lng: data.coordinates.lng
                    };

                    setupLongPressDrag(marker, noteData);
                    marker.bindPopup(createPopupContent(noteData));
                    allMarkers.push(noteData);
                    importedCount++;
                }

                updateCounter();
                updateFilterUI();
                saveToLocalStorage();

                if (importedCount > 0) {
                    showToast(`Импортировано заметок: ${importedCount}`);
                } else {
                    showToast('Все заметки из ZIP уже присутствуют на карте');
                }
            } catch (err) {
                console.error('Ошибка импорта ZIP:', err);
                showToast('Ошибка при чтении ZIP-файла');
            }
        }

        function applyFilter(color = currentFilterColor, tag = currentFilterTag) {
            currentFilterColor = color;
            currentFilterTag = tag;
            
            allMarkers.forEach(note => {
                const matchColor = !currentFilterColor || note.color === currentFilterColor;
                const matchTag = !currentFilterTag || (Array.isArray(note.tags) && note.tags.includes(currentFilterTag));

                if (matchColor && matchTag) {
                    if (!map.hasLayer(note.marker)) {
                        map.addLayer(note.marker);
                    }
                } else {
                    if (map.hasLayer(note.marker)) {
                        map.removeLayer(note.marker);
                    }
                }
            });

            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                const btnColor = btn.dataset.color;
                if ((!currentFilterColor && !btnColor) || btnColor === currentFilterColor) {
                    btn.classList.add('ring-2', 'ring-offset-1', 'ring-blue-500', 'scale-105');
                } else {
                    btn.classList.remove('ring-2', 'ring-offset-1', 'ring-blue-500', 'scale-105');
                }
            });

            const tagBtns = document.querySelectorAll('.tag-filter-btn');
            tagBtns.forEach(btn => {
                const btnTag = btn.dataset.tag;
                if ((!currentFilterTag && !btnTag) || btnTag === currentFilterTag) {
                    btn.classList.add('bg-blue-600', 'text-white');
                    btn.classList.remove('bg-gray-100', 'text-gray-600');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white');
                    btn.classList.add('bg-gray-100', 'text-gray-600');
                }
            });
        }

        function updateCounter() {
            const counter = document.getElementById('notes-counter');
            if (counter) {
                counter.textContent = `Заметок: ${allMarkers.length}`;
            }
        }

        function updateFilterUI() {
            const filterPanel = document.getElementById('filter-panel');
            const colorsContainer = document.getElementById('filter-colors');
            const tagsContainer = document.getElementById('filter-tags');
            const tagsSection = document.getElementById('filter-tags-section');

            if (!filterPanel || !colorsContainer || !tagsContainer) return;

            if (allMarkers.length === 0) {
                filterPanel.classList.add('hidden');
                filterPanel.classList.remove('flex');
                return;
            }

            filterPanel.classList.remove('hidden');
            filterPanel.classList.add('flex');

            const usedColors = Array.from(new Set(allMarkers.map(m => m.color)));
            colorsContainer.innerHTML = `
                <button onclick="applyFilter(null, currentFilterTag)" class="filter-btn px-2 py-1 text-xs font-semibold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all ${!currentFilterColor ? 'ring-2 ring-offset-1 ring-blue-500 scale-105' : ''}">
                    Все
                </button>
            ` + usedColors.map(c => `
                <button onclick="applyFilter('${c}', currentFilterTag)" data-color="${c}" class="filter-btn w-6 h-6 rounded-full border-2 border-white shadow-sm transition-all hover:scale-110 ${currentFilterColor === c ? 'ring-2 ring-offset-1 ring-blue-500 scale-105' : ''}" style="background-color: ${c};" title="${c}">
                </button>
            `).join('');

            const allTags = getAllExistingTags();
            if (allTags.length > 0) {
                tagsSection.classList.remove('hidden');
                tagsContainer.innerHTML = `
                    <button onclick="applyFilter(currentFilterColor, null)" class="tag-filter-btn px-2 py-1 text-xs font-semibold rounded-lg transition-all ${!currentFilterTag ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                        Все
                    </button>
                ` + allTags.map(t => `
                    <button onclick="applyFilter(currentFilterColor, '${escapeHtml(t)}')" data-tag="${escapeHtml(t)}" class="tag-filter-btn px-2 py-1 text-xs font-semibold rounded-lg transition-all ${currentFilterTag === t ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                        #${escapeHtml(t)}
                    </button>
                `).join('');
            } else {
                tagsSection.classList.add('hidden');
            }
        }

        function saveToLocalStorage() {
            const dataToSave = allMarkers.map(m => ({
                id: m.id,
                title: m.title,
                text: m.text,
                color: m.color,
                tags: m.tags || [],
                image: m.image,
                lat: m.lat,
                lng: m.lng
            }));
            localStorage.setItem('map_notes_data', JSON.stringify(dataToSave));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('map_notes_data');
            if (!saved) return;

            try {
                const notes = JSON.parse(saved);
                if (Array.isArray(notes)) {
                    notes.forEach(data => {
                        const latlng = [data.lat, data.lng];
                        const customIcon = L.divIcon({
                            className: 'custom-marker-icon',
                            html: createSvgIcon(data.color || '#3B82F6'),
                            iconSize: [32, 48],
                            iconAnchor: [16, 48],
                            popupAnchor: [0, -42]
                        });

                        const marker = L.marker(latlng, { icon: customIcon, draggable: false }).addTo(map);

                        const noteData = {
                            id: data.id || Date.now() + Math.random(),
                            marker: marker,
                            color: data.color || '#3B82F6',
                            title: data.title,
                            text: data.text || '',
                            image: data.image || null,
                            tags: data.tags || [],
                            lat: data.lat,
                            lng: data.lng
                        };

                        setupLongPressDrag(marker, noteData);
                        marker.bindPopup(createPopupContent(noteData));
                        allMarkers.push(noteData);
                    });

                    updateCounter();
                    updateFilterUI();
                }
            } catch (e) {
                console.error('Ошибка загрузки локальных заметок:', e);
            }
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = 'bg-gray-900/90 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-lg backdrop-blur-md border border-gray-700/50 flex items-center gap-2 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto';
            toast.innerHTML = `<span>💬</span><span>${escapeHtml(message)}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
